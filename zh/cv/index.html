<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0; url=https://mykcs.github.io/zh/cv/">
  <link rel="canonical" href="https://mykcs.github.io/zh/cv/">
  <title>Redirecting to Rui Wang's homepage</title>
  <script>
    (() => {
      const target = new URL('https://mykcs.github.io/zh/cv/');
      target.search = location.search;
      target.hash = location.hash;
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>Homepage moved to <a href="https://mykcs.github.io/zh/cv/">mykcs.github.io</a>.</p>
</body>
</html>
